{{- $page := .page -}}
{{- $p := .sd.profile -}}
<footer class="footer">
  <span>© {{ now.Year }} {{ $p.personal.fullName }}</span>
  {{- with $p.contact.email }}<a href="mailto:{{ . }}">{{ . }}</a>{{ end }}
  {{- with $p.contact.location }}<span>{{ . }}</span>{{ end }}
  {{ partial "social-links.html" .sd.config }}
</footer>
