baseURL = 'https://clixmods.github.io/'
theme = 'portfolio.theme'

# Build configuration
buildDrafts = false
buildFuture = false

# Multilingual configuration
defaultContentLanguage = 'fr'
# Keep French at root, English under /en/
defaultContentLanguageInSubdir = false

# Build stats for PurgeCSS - writes hugo_stats.json with all used HTML elements
[build]
  [build.buildStats]
    enable = true

[caches]
  [caches.images]
    dir = ':cacheDir/images'

[languages]
	[languages.fr]
		languageName = 'Français'
        languageCode = 'fr-fr'
        weight = 1
        title = "Portfolio - Clément 'Clix' GARCIA"
    [languages.en]
      languageName = 'English'
      languageCode = 'en-us'
      weight = 2
      title = "Portfolio - Clément 'Clix' GARCIA"
    
# Module mounts - Allow Hugo to process static images as resources
[module]
  [module.hugoVersion]
    extended = false
    min = "0.115.0"
  [[module.mounts]]
    source = "static/images"
    target = "assets/images"
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "assets"
    target = "assets"
  # Watch hugo_stats.json for PurgeCSS hot reload
  [[module.mounts]]
    source = "hugo_stats.json"
    target = "assets/watching/hugo_stats.json"

# Optional: surface missing i18n keys during development
# enableMissingTranslationPlaceholders = true