projects:
  # Projets professionnels
  - title: "Terra Memoria"
    subtitle: "JRPG - Studio La Moutarde"
    description: "Fin de production d'un jeu vidéo commercial sur Unity"
    fullDescription: "Participation à la fin de production d'un JRPG complet développé sur Unity. Travail sur le portage console Nintendo Switch, maintenance post-release, et développement d'outils de production. Projet commercial distribué sur Steam, Switch et Xbox Game Pass."
    image: "/images/projects/terra-memoria.jpg"
    tags: ["#JRPG", "#Unity", "#Commercial", "#Nintendo Switch"]
    technologies: ["Unity", "C#", "Nintendo Switch", "Steam"]
    category: "projects"
    featured: true

  - title: "Application Web Blazor"
    subtitle: "Full-Stack - Studio La Moutarde"
    description: "Application web développée avec Blazor et FastEndpoint"
    fullDescription: "Développement d'une application web complète utilisant Blazor pour le frontend (Client side) et FastEndpoint pour les API. Architecture modulaire et intégration temps réel. Projet professionnel démontrant les compétences en développement web moderne."
    image: "/images/projects/blazor-app.jpg"
    tags: ["#Blazor", "#FastEndpoint", "#Full-Stack", "#Professional"]
    technologies: ["Blazor", ".NET", "FastEndpoint", "C#"]
    category: "projects"
    featured: true

  # Projets académiques majeurs
  - title: "The Lost City: Stone Keepers"
    subtitle: "PFA Deuxième Année - e-artsup"
    description: "Aventure épique inspirée de Tunic dans l'Atlantide"
    fullDescription: "Projet de fin d'année réalisé en équipe. Jeu d'aventure avec exploration de ruines anciennes, combat contre des créatures mythiques et résolution de mystères. Style visuel et gameplay inspirés de Tunic, transportant le joueur dans un monde fantastique rempli de merveilles."
    image: "/images/projects/stone-keepers.jpg"
    tags: ["#Adventure", "#Unity", "#Team Project", "#Atlantis"]
    technologies: ["Unity", "C#", "Game Design"]
    category: "projects"
    featured: true

  - title: "Assault of Order"
    subtitle: "PFA Première Année - e-artsup"
    description: "Jeu stratégique inspiré des échecs pour deux joueurs"
    fullDescription: "Jeu stratégique au tour par tour où deux joueurs s'affrontent avec des escouades de 4 personnages. Mécaniques inspirées des échecs avec gestion de positionnement et champ d'action. Projet réalisé en équipe dans le cadre du Projet de Fin d'Année."
    image: "/images/projects/assault-order.jpg"
    tags: ["#Strategy", "#Turn-Based", "#Multiplayer", "#Chess-like"]
    technologies: ["Unity", "C#", "Pathfinding A*"]
    category: "projects"
    featured: false

  # Projets techniques et plugins
  - title: "Éclairage Volumétrique Unity URP"
    subtitle: "Plugin Technique"
    description: "Plugin Unity pour effets de lumière volumétrique"
    fullDescription: "Développement d'un plugin Unity utilisant le ray marching pour créer des effets de lumière volumétrique sur le Universal Render Pipeline. Projet technique explorant les shaders HLSL et les effets visuels avancés. Utilisé dans le projet Bubble Wars pour simuler l'environnement sous-marin."
    image: "/images/projects/volumetric-lighting.jpg"
    tags: ["#Unity Plugin", "#HLSL", "#Shaders", "#URP"]
    technologies: ["Unity", "HLSL", "Shaders", "URP"]
    category: "projects"
    featured: false

  - title: "Plugins Unity - Outils de Production"
    subtitle: "Système d'outils pour développeurs"
    description: "Collection de plugins Unity pour faciliter le développement"
    fullDescription: "Développement de plusieurs plugins Unity : XMaterials (paramètres étendus), XTrigger (triggers sans code), Data Persistent System (sauvegarde), Audio Aliases (gestion audio améliorée), Pathfinding A* (navigation sur grille). Outils conçus pour améliorer la productivité des équipes de développement."
    image: "/images/projects/unity-plugins.jpg"
    tags: ["#Unity", "#Tools", "#Productivity", "#Framework"]
    technologies: ["Unity", "C#", "Editor Tools"]
    category: "projects"
    featured: false

  # Projets de modding
  - title: "Call of Duty: Mods Collection"
    subtitle: "800,000 téléchargements Steam Workshop"
    description: "Collection de mods et cartes pour Call of Duty: Black Ops 3"
    fullDescription: "Création de contenus pour le Steam Workshop de Call of Duty: Black Ops 3. Plus de 50 contenus développés ou co-développés, incluant des cartes complètes, des mods de gameplay et des outils communautaires. Gestion de communauté et administration des groupes modding francophones et anglophones."
    image: "/images/projects/cod-modding.jpg"
    tags: ["#Modding", "#Community", "#Steam Workshop", "#800k Downloads"]
    technologies: ["LUA", "Call of Duty Tools", "Level Design", "Community Management"]
    category: "projects"
    featured: true

  # Game Jams et projets courts
  - title: "Projets Game Jam"
    subtitle: "Global Game Jam 2024 & Itch.io Jams"
    description: "Création de jeux en temps contraint avec équipes aléatoires"
    fullDescription: "Participation régulière aux Game Jams depuis 2020, notamment la Global Game Jam 2024 et diverses Game Jams sur Itch.io. Développement rapide de prototypes de jeux avec des équipes formées aléatoirement, renforçant les compétences en travail d'équipe, gestion du temps et créativité sous contrainte."
    image: "/images/projects/game-jams.jpg"
    tags: ["#Game Jam", "#Rapid Prototyping", "#Team Work", "#Creativity"]
    technologies: ["Unity", "C#", "Rapid Development"]
    category: "projects"
    featured: false

